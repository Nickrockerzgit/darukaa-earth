# Render Blueprint: the Dockerised API.
#
# The database is deliberately NOT provisioned here. Render's free Postgres is
# deleted 30 days after creation, which would take the demo down before anyone
# reviewed it; the database lives on Neon instead, whose free tier does not
# expire. See docs/decisions/ADR-0008-database-hosting.md.
#
# Create this once with "New > Blueprint" and point Render at this repository.
services:
  - type: web
    name: darukaa-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Build the production stage, not the dev one.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    # Runs after the build and before the new instance takes traffic, so the
    # schema is always at least as new as the code querying it.
    preDeployCommand: alembic upgrade head
    autoDeploy: false # GitHub Actions triggers the deploy once CI is green.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: 'false'
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '7'
      # Neon's pooled endpoint does its own pooling, so keep ours small.
      - key: DB_POOL_SIZE
        value: '5'
      - key: DB_MAX_OVERFLOW
        value: '5'
      - key: CORS_ORIGINS
        # Set to the Vercel production domain after the first web deploy.
        sync: false
      - key: DATABASE_URL
        # Paste the Neon connection string, with the driver changed to asyncpg:
        #   postgresql+asyncpg://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/darukaa?sslmode=require
        # The sslmode and channel_binding parameters can stay - app/db/session.py
        # strips them and passes TLS through connect_args instead.
        sync: false
