# Render Blueprint: one managed PostGIS database plus the Dockerised API.
# Create it once with "New > Blueprint" and point Render at this repository.
services:
  - type: web
    name: darukaa-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Build the production stage, not the dev one.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    # Runs after the build and before the new instance takes traffic, so the
    # schema is always at least as new as the code querying it.
    preDeployCommand: alembic upgrade head
    autoDeploy: false # GitHub Actions triggers the deploy once CI is green.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: 'false'
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '7'
      - key: DB_POOL_SIZE
        value: '5'
      - key: DB_MAX_OVERFLOW
        value: '5'
      - key: CORS_ORIGINS
        # Replace with the Vercel production domain after the first web deploy.
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-db
          property: connectionString

databases:
  - name: darukaa-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
