# Local development stack.
# `make dev` brings up PostGIS + the FastAPI API + the Vite dev server with hot reload.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: darukaa-db
    environment:
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
      POSTGRES_DB: darukaa
    ports:
      # 5433 on the host: 5432 is commonly taken by a native
      # PostgreSQL install. Inside the compose network it is still 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darukaa -d darukaa']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    container_name: darukaa-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://darukaa:darukaa@db:5432/darukaa
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    container_name: darukaa-web
    working_dir: /app
    env_file:
      - ./frontend/.env
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"

volumes:
  pgdata:
  web_node_modules:
