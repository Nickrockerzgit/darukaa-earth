name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: '3.12'

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check . --output-format=github

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy (strict)
        run: python -m mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    # PostGIS as a service container: the suite runs against the same
    # extension set as production, so a PostGIS-specific bug (geography casts,
    # GIST indexes, ST_Extent) fails here rather than on the demo URL.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://darukaa:darukaa@localhost:5432/darukaa_test
      TEST_DATABASE_URL: postgresql+asyncpg://darukaa:darukaa@localhost:5432/darukaa_test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-to-pass-validation
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: python -m pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations are reversible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://darukaa:darukaa@localhost:5432/darukaa_migrations
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-to-pass-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base
        # A migration that cannot be undone is a migration that cannot be
        # rolled back in an incident.
        run: alembic downgrade base

      - name: Upgrade to head again
        run: alembic upgrade head

      - name: Fail if the models have drifted from the migrations
        # An empty autogenerate diff proves the ORM and the schema agree.
        run: |
          alembic revision --autogenerate -m "drift-check" --rev-id drift_check
          if grep -qE "op\.(create|drop|add|alter)" alembic/versions/drift_check_*.py; then
            echo "::error::Models have changed without a migration. Run 'make migration m=\"...\"'."
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm -f alembic/versions/drift_check_*.py
